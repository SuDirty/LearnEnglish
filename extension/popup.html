<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕口袋</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><div class="brand">S<span>↗</span></div><p class="eyebrow">SUBTITLE POCKET</p><h1>每一句，都有收穫。</h1><p class="muted">看 Netflix，也把新學會的英文帶走。</p>
<div class="settings"><label>啟用字幕翻譯<input type="checkbox" id="enabled" role="switch"></label><label>查詢時暫停影片<input type="checkbox" id="pauseOnLookup" role="switch"></label></div>
<button class="primary wide" id="open">打開我的收藏 <span id="count">0</span> ↗</button>
<button class="wide" id="translation-settings">字典／翻譯設定 ↗</button><p class="hint">逐字稿上方點「設定與資訊」→「複習模式」，可設定中英遮蔽、收藏種類及對話暫停。點逐字稿單字查詞義，點時間跳轉。會嘗試自動取得中英文字幕，再還原你原本的字幕設定；單字先查離線字典；查不到時使用你選擇的 Google 或 Codex 翻譯。收藏只存本機。</p><p id="status" role="status"></p><script src="popup.js" type="module"></script></body></html>
