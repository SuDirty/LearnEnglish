<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的收藏 · 字幕口袋</title><link rel="stylesheet" href="ui.css"></head>
<body class="library"><header><a class="wordmark" href="library.html"><span class="brand small">S↗</span>字幕口袋</a><span class="local">● 儲存在這台電腦</span></header>
<main><div class="intro"><div><p class="eyebrow">YOUR WORDS, YOUR WORLD</p><h1>故事看完了，<br><em>英文留下來。</em></h1><p class="muted">那些讓你停下來的單字，都是下一次聽懂的開始。</p></div><div class="stats"><strong id="total">0</strong><span>個值得記住的片刻</span></div></div>
<div class="toolbar"><div class="filters" role="group" aria-label="收藏類型"><button data-filter="all" class="active" aria-pressed="true">全部收藏</button><button data-filter="word" aria-pressed="false">單字</button><button data-filter="phrase" aria-pressed="false">片語</button><button data-filter="sentence" aria-pressed="false">句子</button></div><div class="exports"><button id="csv">匯出 CSV ↓</button><button id="json">備份 JSON ↓</button></div></div>
<input id="search" type="search" placeholder="搜尋英文、中文或影片名稱…" aria-label="搜尋收藏"><p id="status" role="status" aria-live="polite"></p><div id="entries" class="grid"></div>
<section id="empty" class="empty"><div class="empty-icon">Aa</div><h2>第一個單字，從下一集開始。</h2><p>在 Netflix 開啟英文字幕，點選不懂的字，<br>翻譯後按「＋ 收藏」，它就會出現在這裡。</p></section></main>
<footer>SUBTITLE POCKET <span>學習，藏在每一個故事裡。</span></footer><script src="library.js" type="module"></script></body></html>
